name: Publish knowledge files

on:
  push:
    branches:
      - dev
    paths:
      - "imgs/**"
      - "docs/rss.sample.txt"
      - ".github/scripts/requirements.txt"
      - ".github/scripts/imgs.py"
      - ".github/scripts/rss.py"
      - ".github/workflows/publish.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Inspect feed.rss
        run: |
            ls -lh feed.rss
            file feed.rss
            head -n 5 feed.rss

      - name: Update posts.md and posts.json
        run: python .github/scripts/rss.py

      - name: Update imgs.json
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: python .github/scripts/imgs.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.md posts.json imgs.json

          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi

          git commit -m "chore: refresh knowledge files"
          git push origin HEAD:${{ github.ref_name }}