openapi: 3.1.0

info:
  title: Burnout Series Knowledge
  description: >
    Read the latest Burnout Series knowledge files directly from the
    Blackaft GitHub repository.
  version: "1.0.0"

servers:
  - url: https://raw.githubusercontent.com/blackaft/burnoutseries/dev

paths:
  /posts.json:
    get:
      operationId: getPostsIndex
      summary: Get the Burnout Series post index
      description: >
        Returns structured metadata for all indexed posts, including the
        latest post, titles, publication dates, creators, slugs, and URLs.
      responses:
        "200":
          description: Post index retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsIndex"

  /posts.md:
    get:
      operationId: getPostsContent
      summary: Get the full Burnout Series post corpus
      description: >
        Returns the cleaned Markdown content for all indexed Burnout Series
        posts. Use this when discussing, quoting, summarizing, or exploring
        the substance of the posts.
      responses:
        "200":
          description: Post corpus retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /about.txt:
    get:
      operationId: getSeriesAbout
      summary: Get background information about Burnout
      description: >
        Returns the project's manually maintained background, framing, and
        contextual information.
      responses:
        "200":
          description: Series background retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /imgs.json:
    get:
      operationId: getImageIndex
      summary: Get the Burnout Series image index
      description: >
        Returns the base image URL and the filenames available in the
        repository's image directory.
      responses:
        "200":
          description: Image index retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageIndex"

components:
  schemas:
    PostsIndex:
      type: object
      properties:
        updated_at:
          type:
            - string
            - "null"
          description: UTC timestamp for the latest generated index
        latest:
          type:
            - string
            - "null"
          description: Slug of the latest indexed post
        count:
          type: integer
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostMetadata"
      required:
        - updated_at
        - latest
        - count
        - posts

    PostMetadata:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        creator:
          type: string
        published:
          type: string
          format: date-time
        url:
          type: string
          format: uri
      required:
        - slug
        - title
        - creator
        - published
        - url

    ImageIndex:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        base_url:
          type: string
          format: uri
        count:
          type: integer
        imgs:
          type: array
          items:
            type: string
      required:
        - updated_at
        - base_url
        - count
        - imgs