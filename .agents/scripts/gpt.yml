openapi: 3.1.0

info:
  title: Knowledge Base for the Burnout Series
  description: >
    AI companion knowledge base for Burnout Series audiences. Use the manifest
    first to inspect the available prompt context, about material, Substack
    post metadata, and image assets before requesting specific content files.
  version: "1.0.0"

servers:
  - url: https://raw.githubusercontent.com/blackaft/burnoutseries/dev

paths:
  /.agents/vaults/manifest.json:
    get:
      operationId: getManifest
      summary: Get the Burnout Series manifest
      description: >
        Returns the merged Burnout manifest. Start here for factual questions
        so the GPT can read repository config, prompt context, available about
        files, post files, post substack URLs, and image assets before
        drilling into content. Use `substack_url` for post links. Use
        `base_url` plus section `path` plus `file` only for raw repository
        content.
      responses:
        "200":
          description: Manifest retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Manifest"

  /.agents/vaults/posts/{postFile}:
    get:
      operationId: getPostsContent
      summary: Get an individual Burnout Series post
      description: >
        Returns the cleaned Markdown content for an indexed Burnout Series
        post. Use this when discussing, quoting, summarizing, or exploring the
        substance of the posts. This endpoint returns raw repository content,
        not a public website URL.
      parameters:
        - name: postFile
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /.agents/vaults/about/{aboutFile}:
    get:
      operationId: getSeriesAbout
      summary: Get background information about Burnout
      description: >
        Returns the project's AI-first background, framing, and contextual
        information.
      parameters:
        - name: aboutFile
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series background retrieved successfully
          content:
            text/plain:
              schema:
                type: string

components:
  schemas:
    Manifest:
      type: object
      properties:
        config:
          type: object
        updated_at:
          type:
            - string
            - "null"
        base_url:
          type: string
          format: uri
        posts:
          $ref: "#/components/schemas/PostsIndex"
        about:
          $ref: "#/components/schemas/AboutIndex"
        imgs:
          $ref: "#/components/schemas/ImageIndex"
      required:
        - config
        - updated_at
        - base_url
        - posts
        - about
        - imgs

    PostsIndex:
      type: object
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostMetadata"
      required:
        - path
        - items

    PostMetadata:
      type: object
      properties:
        excerpt:
          type: string
        file:
          type: string
        substack_url:
          type: string
          format: uri
      required:
        - excerpt
        - file
        - substack_url

    AboutIndex:
      type: object
      properties:
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AboutItem"
      required:
        - path
        - items

    AboutItem:
      type: object
      properties:
        excerpt:
          type: string
        file:
          type: string
      required:
        - excerpt
        - file

    ImageIndex:
      type: object
      properties:
        path:
          type: string
        items:
          type: array
          items:
            type: string
      required:
        - path
        - items
