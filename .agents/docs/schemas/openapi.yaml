openapi: 3.1.0

info:
  title: Knowledge Base for the Burnout Series
  description: >
    AI companion knowledge base for Burnout Series audiences. Use the index
    first to inspect the available vault context, grouped about material,
    Substack post metadata, and image assets before requesting specific
    content files.
  version: "1.0.0"

servers:
  - url: https://raw.githubusercontent.com/blackaft/burnoutseries/dev

paths:
  /api/burnoutseries/index.json:
    get:
      operationId: getManifest
      summary: Get the Burnout Series index
      description: >
        Start here for factual questions. The index exposes vault metadata,
        prompts, navigation, grouped about files, Substack post metadata,
        `substack_url` values, and image assets. Use `substack_url` for post
        links. Use `base_url` plus section `path` plus `file` only for raw
        repository content.
      responses:
        "200":
          description: Index retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Index"

  /vaults/burnoutseries/substack/articles/{postFile}:
    get:
      operationId: getPostsContent
      summary: Get an individual Burnout Series post
      description: >
        Returns the cleaned Markdown content for an indexed Burnout Series
        post. Use this when discussing, quoting, summarizing, or exploring the
        substance of the posts. This endpoint returns raw repository content,
        not a public website URL.
      parameters:
        - name: postFile
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /vaults/burnoutseries/about/{aboutFile}:
    get:
      operationId: getSeriesAbout
      summary: Get background information about Burnout
      description: >
        Returns the project's AI-first background, creator framing, and story
        context files.
      parameters:
        - name: aboutFile
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Series background retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /vaults/burnoutseries/vault.json:
    get:
      operationId: getVaultConfig
      summary: Get the Burnout Series vault metadata
      description: >
        Returns the vault-level metadata, navigation, and prompt guidance for
        Burnout Series.
      responses:
        "200":
          description: Vault metadata retrieved successfully
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    Index:
      type: object
      properties:
        updated_at:
          type: string
          format: date-time
        base_url:
          type: string
          format: uri
        vault:
          type: object
        about:
          $ref: "#/components/schemas/AboutGroups"
        substack:
          $ref: "#/components/schemas/SubstackGroups"
      required:
        - updated_at
        - base_url
        - vault
        - about
        - substack

    AboutGroups:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/AboutIndex"
        story:
          $ref: "#/components/schemas/AboutIndex"
        creator:
          $ref: "#/components/schemas/AboutIndex"
      required:
        - project
        - story
        - creator

    SubstackGroups:
      type: object
      properties:
        articles:
          $ref: "#/components/schemas/PostsIndex"
        imgs:
          $ref: "#/components/schemas/ImageIndex"
      required:
        - articles
        - imgs

    PostsIndex:
      type: object
      properties:
        path:
          type: string
        latest:
          type:
            - string
            - "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostMetadata"
      required:
        - path
        - latest
        - items

    PostMetadata:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        excerpt:
          type: string
        created_by:
          type: string
        published_at:
          type: string
          format: date-time
        file:
          type: string
        substack_url:
          type: string
          format: uri
      required:
        - id
        - title
        - excerpt
        - created_by
        - published_at
        - file
        - substack_url

    AboutIndex:
      type: object
      properties:
        category:
          type: string
        path:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/AboutItem"
      required:
        - category
        - path
        - items

    AboutItem:
      type: object
      properties:
        id:
          type: string
        excerpt:
          type: string
        file:
          type: string
      required:
        - id
        - excerpt
        - file

    ImageIndex:
      type: object
      properties:
        path:
          type: string
        items:
          type: array
          items:
            type: string
      required:
        - path
        - items
